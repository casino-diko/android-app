<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
	body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #111; color: #eee; font: 16px system-ui, sans-serif; text-align: center; }
	main { padding: 24px; max-width: 320px; }
	h1 { font-size: 20px; margin: 0 0 8px; }
	p { color: #aaa; margin: 0 0 24px; }
	button { padding: 12px 28px; font: inherit; font-weight: 600; color: #111; background: #e6c96a; border: 0; border-radius: 6px; }
</style>
</head>
<body>
<main>
	<h1>Can't reach the tables</h1>
	<p>Check your connection and try again.</p>
	<button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
